<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Mock only: the calm capture bar. Surfaces in system colours, one brand-blue button, no outlines. */
      :root {
        color-scheme: light;
        --material: rgb(236 236 236 / 0.86);
        --ink: #1d1d1f;
        --dim: #6e6e73;
        --soft: rgb(0 0 0 / 0.07);
        --hover: rgb(0 0 0 / 0.04);
        --sep: rgb(0 0 0 / 0.1);
        --brand: #0f72db;
        --desk: linear-gradient(135deg, #b9c7d6, #dfe4ea);
      }
      body.dark {
        color-scheme: dark;
        --material: rgb(40 40 42 / 0.86);
        --ink: #f5f5f7;
        --dim: #a1a1a6;
        --soft: rgb(255 255 255 / 0.12);
        --hover: rgb(255 255 255 / 0.06);
        --sep: rgb(255 255 255 / 0.12);
        --desk: linear-gradient(135deg, #1e2833, #333a44);
      }
      body {
        margin: 0;
        width: 1080px;
        height: 140px;
        display: grid;
        place-items: center;
        background: var(--desk);
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px;
        border-radius: 12px;
        background: var(--material);
        backdrop-filter: blur(30px);
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 0.2),
          0 10px 30px rgb(0 0 0 / 0.2);
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      button:hover {
        background: var(--hover);
      }
      button[aria-checked='true'] {
        background: var(--soft);
      }
      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chev {
        width: 10px;
        height: 10px;
        color: var(--dim);
      }
      .icon {
        width: 32px;
        padding: 0;
        justify-content: center;
        color: var(--dim);
      }
      .sep {
        width: 1px;
        height: 20px;
        margin: 0 4px;
        background: var(--sep);
      }
      .dim {
        color: var(--dim);
      }
      #capture {
        margin-left: 4px;
        padding: 0 14px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      #capture kbd {
        font: inherit;
        font-weight: 400;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button class="icon" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg>
      </button>
      <span class="sep"></span>
      <button role="radio" aria-checked="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="2.5 2.5" /></svg>New Area
      </button>
      <button role="radio">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 9h18" /></svg
        >Window
      </button>
      <button role="radio">
        <svg viewBox="0 0 24 24">
          <rect x="2.5" y="4" width="19" height="13" rx="1.5" />
          <path d="M9 20.5h6M12 17v3.5" /></svg
        >Full Screen
      </button>
      <button role="radio">
        <svg viewBox="0 0 24 24">
          <rect x="2.5" y="4" width="16" height="12" rx="1.5" />
          <circle cx="18.5" cy="16.5" r="3.5" fill="currentColor" /></svg
        >Last Area
      </button>
      <button role="radio">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="2.5" width="16" height="12" rx="1.5" />
          <path d="M12 15v6.5M9 18.5l3 3 3-3" /></svg
        >Scrolling
      </button>
      <button role="radio">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="3" fill="currentColor" /></svg
        >Record
      </button>
      <span class="sep"></span>
      <button>
        <span class="dim">To</span>Ledgerly Q4 review<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      <button>
        Options<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      <button id="capture">Capture <kbd>↩</kbd></button>
    </div>
  </body>
</html>
