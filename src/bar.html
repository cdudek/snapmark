<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Capture Options</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        user-select: none;
        white-space: nowrap; /* the window is as wide as its content (preferred size), so no label may wrap */
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
      }
      /* Opaque where there is no vibrancy (Linux); on macOS the window's popover material shows through. */
      body {
        display: flex;
        align-items: center;
        gap: 8px; /* 8-pt rhythm: every control and hairline 8 pt apart, and 8 pt to every edge */
        box-sizing: border-box;
        padding: 8px;
        border-radius: 12px;
        overflow: hidden;
        background: Canvas;
        color: CanvasText;
      }
      body.mac {
        background: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      button:focus-visible {
        outline: 2px solid #0f72db;
        outline-offset: 2px; /* outside the chosen mode's accent fill, inside the 8 pt gaps */
      }
      #close {
        width: 40px;
      }
      [role='radiogroup'] {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      [role='radio'] {
        width: 40px; /* 40 × 40 hit targets throughout */
      }
      /* The chosen mode: an accent fill, white icon. 3:1 or more on the popover material, light (#ececec, 4.0:1) and
         dark (#282828, 3.5:1); the icon 4.3:1 or more on the fill (WCAG 1.4.11, guideline A9). */
      [role='radio'][aria-checked='true'] {
        background: light-dark(#0f72db, #1f7ae0);
        color: #fff;
      }
      .sep {
        width: 1px;
        height: 28px;
        flex: none;
        background: rgb(128 128 128 / 0.4);
      }
      #options {
        padding: 0 12px;
      }
      #capture {
        padding: 0 16px;
        font-weight: 600;
        background: rgb(128 128 128 / 0.18);
      }
      svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #close svg {
        width: 18px;
        height: 18px;
      }
      #options svg {
        width: 12px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <button id="close" aria-label="Close" title="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M9 9l6 6M15 9l-6 6" />
      </svg>
    </button>
    <div role="radiogroup" aria-label="Mode">
      <button role="radio" data-mode="window" aria-checked="false" tabindex="-1" aria-label="Capture Window" title="Capture Window">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 9h18M6 7h.01M8 7h.01" />
        </svg>
      </button>
      <button role="radio" data-mode="area" aria-checked="false" tabindex="-1" aria-label="Choose New Area" title="Choose New Area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="2.5 2.5" /></svg>
      </button>
      <button role="radio" data-mode="last" aria-checked="false" tabindex="-1" aria-label="Capture Last Area" title="Capture Last Area">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="4" width="16" height="12" rx="1.5" />
          <circle cx="18.5" cy="16.5" r="3.5" fill="currentColor" />
        </svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button role="radio" data-mode="scroll" aria-checked="false" tabindex="-1" aria-label="Capture Scrolling" title="Capture Scrolling">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="2.5" width="16" height="12" rx="1.5" />
          <path d="M12 15v6.5M9 18.5l3 3 3-3" />
        </svg>
      </button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button id="options" aria-haspopup="menu" aria-label="Options" title="Options">
      Options<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </button>
    <button id="capture" aria-label="Capture" title="Capture">Capture</button>
    <script src="bar.js"></script>
  </body>
</html>
