<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Capture Scrolling</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <!-- Shared by Capture Scrolling and Record (scroll.html#record, the recording control) -->
    <style>
      /* The calm scrolling control (spec screens.md, Panels): colours, sizes and shapes from tokens.css only (F22). The
         window's material and system text on macOS, the tokens' greys elsewhere (F16). */
      html,
      body {
        margin: 0;
        height: 100%;
        user-select: none;
        font:
          var(--ds-type-control-weight) var(--ds-type-control-size) / var(--ds-type-control-line) -apple-system,
          system-ui,
          sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        gap: var(--ds-space-8);
        box-sizing: border-box;
        padding: 0 var(--ds-space-8);
        border-radius: var(--ds-radius-large);
        overflow: hidden;
        background: var(--ds-color-panel);
        color: var(--ds-color-ink);
      }
      #what {
        flex: 1;
      }
      #count {
        font-variant-numeric: tabular-nums;
        line-height: 1.3;
      }
      #count.warn {
        color: var(--ds-color-warn-text);
      }
      /* No border or outline at rest; hover is a faint soft fill (F19). */
      button {
        font: inherit;
        color: inherit;
        height: var(--ds-control-md);
        padding: 0 var(--ds-button-padding-x);
        border: 0;
        outline: 0;
        border-radius: var(--ds-radius);
        background: none;
        display: inline-flex;
        align-items: center;
        gap: var(--ds-space-6);
        flex: none;
        white-space: nowrap;
      }
      button:hover {
        background: var(--ds-color-soft-hover);
      }
      /* The focus ring after Tab only, in the system's focus colour. */
      button:focus-visible {
        outline: var(--ds-ring-width) solid var(--ds-color-focus);
        outline-offset: var(--ds-ring-offset);
      }
      /* Esc is a plain icon (spec screens.md); Done is the one control filled with the accent (F17). */
      #cancel {
        width: var(--ds-control-md);
        padding: 0;
        justify-content: center;
        color: var(--ds-color-dim);
      }
      #cancel svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      #done {
        background: var(--ds-button-fill-primary);
        color: var(--ds-button-text-primary);
        font-weight: var(--ds-button-weight-primary);
      }
      #done kbd {
        font: inherit;
        font-weight: var(--ds-font-weight-regular);
        opacity: 0.75;
      }
      /* The recording control: ⓧ, the red dot and the clock, Done, the hint; the scrolling control: ⓧ, its status line,
         Done. Dark HUD in light and dark mode. */
      :root {
        color-scheme: light dark;
        --rec-dot: light-dark(#ff3b30, #ff453a);
      }
      body.record .scroll,
      body:not(.record) .rec {
        display: none;
      }
      .x {
        padding: 6px;
        background: transparent;
        display: inline-flex;
      }
      .x:hover {
        background: rgb(255 255 255 / 0.15);
      }
      .x svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }
      #status {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap; /* the clock never truncates */
        font-variant-numeric: tabular-nums;
        font-size: 15px;
      }
      #dot {
        width: 10px;
        height: 10px;
        flex: none;
        border-radius: 50%;
        background: var(--rec-dot);
      }
      #clock.warn {
        color: #ffb224; /* near the cap */
      }
      #rec-done {
        padding: 8px 20px;
        background: #0f72db;
        font-weight: 600;
      }
      #rec-hint {
        font-size: 11px;
        color: rgb(255 255 255 / 0.7);
      }
      .sr {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <button id="cancel" class="scroll" aria-label="Cancel" aria-keyshortcuts="Escape" title="Cancel (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
    </button>
    <div id="what" class="scroll"><span id="count">Starting…</span></div>
    <button id="done" class="scroll" aria-keyshortcuts="Enter" title="Done (↩, ⌃⇧5)">Done<kbd aria-hidden="true">↩</kbd></button>
    <div id="scroll-say" class="scroll sr" role="status" aria-live="polite"></div>
    <button id="rec-cancel" class="rec x" aria-label="Cancel recording">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M9 9l6 6M15 9l-6 6" />
      </svg>
    </button>
    <div id="status" class="rec"><span id="dot" aria-hidden="true"></span><span id="clock">0:00 of 0:30</span></div>
    <button id="rec-done" class="rec">Done</button>
    <span id="rec-hint" class="rec">⌃⇧5 stops</span>
    <div id="rec-say" class="rec sr" role="status" aria-live="polite"></div>
    <script src="scroll.js"></script>
  </body>
</html>
