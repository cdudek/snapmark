<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: file:; style-src 'self' 'unsafe-inline'" />
    <title>Snapmark</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <style>
      /* The calm session window (spec screens.md): colours, sizes and shapes from tokens.css only (F30). The app's
         controls take the system's colours, the soft pill when chosen; the accent fills one button, Edit Again, where a
         screenshot is shown (F23, F24). The note numbers keep the annotation colour of the marks they match. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        font:
          14px -apple-system,
          system-ui,
          sans-serif;
        background: var(--ds-color-ground);
        color: var(--ds-color-ink);
      }
      [hidden] {
        display: none !important;
      }
      /* The focus ring after Tab only, in the system's focus colour: surface.js sets --ds-color-focus to macOS's accent
         where it reaches 3:1, else to the text colour (F25, N1). */
      :focus-visible {
        outline: var(--ds-ring-width) solid var(--ds-color-focus);
        outline-offset: var(--ds-ring-offset);
      }
      /* No border or outline at rest (F25): the soft fill, a fainter one on hover; 32 pt tall, 13 px text. */
      button {
        height: var(--ds-control-md);
        padding: 0 var(--ds-space-12);
        border: 0;
        border-radius: var(--ds-radius);
        background: var(--ds-button-fill-secondary);
        color: inherit;
        font: inherit;
        font-size: var(--ds-type-control-size);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background-image: linear-gradient(var(--ds-color-soft-hover), var(--ds-color-soft-hover));
      }
      button:disabled {
        opacity: var(--ds-state-disabled-content);
        cursor: default;
      }
      button.primary {
        background-color: var(--ds-button-fill-primary);
        color: var(--ds-button-text-primary);
        font-weight: var(--ds-button-weight-primary);
      }
      /* Header: the traffic lights sit in it (titleBarStyle hiddenInset), so it drags the window */
      header {
        display: flex;
        gap: var(--ds-space-8);
        align-items: center;
        height: 52px;
        padding: 0 14px 0 80px; /* clear of the traffic lights; at 720 pt the tabs and buttons keep their room (F29) */
        min-width: 0; /* a grid item: without it a long name widens the header past the window instead of shortening */
        border-bottom: var(--ds-border) solid var(--ds-color-edge);
        background: var(--ds-color-panel);
        -webkit-app-region: drag;
      }
      header button,
      header input {
        -webkit-app-region: no-drag;
      }
      /* Only the name shrinks in a narrow window or for a long name: the tabs and buttons keep their one line. */
      header > button,
      .tabs {
        flex: none;
        white-space: nowrap;
      }
      header .icon {
        width: 22px;
        height: 22px;
        flex: none;
      }
      .name {
        position: relative;
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
      }
      #title {
        min-width: 0;
        background: none;
        padding: 0 4px;
        font-size: 15px;
        font-weight: var(--ds-font-weight-medium);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: text;
      }
      #pencil {
        width: 24px;
        padding: 0;
        background: none;
        opacity: 0;
        display: grid;
        place-items: center;
      }
      .name:hover #pencil,
      #pencil:focus-visible {
        opacity: 1;
      }
      #pencil svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* The rename field: no edge, a soft fill, the ring while it has the focus */
      #rename {
        font: inherit;
        font-size: 15px;
        width: 240px;
        min-width: 0; /* a narrow window shrinks the field instead of pushing the header off screen */
        height: var(--ds-field-height);
        padding: 0 6px;
        border: 0;
        border-radius: var(--ds-field-radius);
        background: var(--ds-field-fill);
        color: inherit;
      }
      #rename::placeholder {
        color: inherit; /* the text colour: the system's dim text misses 4.5:1 (N1, questions.md) */
        opacity: 1;
      }
      #hint {
        position: absolute;
        top: calc(100% + 1px);
        left: 6px;
        font-size: 11px;
        width: max-content;
        max-width: calc(100vw - 120px); /* wraps in a narrow window rather than running off it */
      }
      #hint.error {
        color: var(--ds-color-error-text);
      }
      .name.editing #title,
      .name.editing #pencil,
      .name:not(.editing) #rename,
      .name:not(.editing) #hint {
        display: none;
      }
      #total {
        font-size: var(--ds-type-control-size);
        white-space: nowrap;
        margin-right: auto;
      }
      /* The tabs: the chosen one is the soft pill, the others plain (F24) */
      .tabs {
        display: flex;
        gap: var(--ds-space-4);
      }
      .tabs button {
        background: none;
      }
      .tabs button[aria-pressed='true'] {
        background: var(--ds-color-soft);
      }
      main {
        overflow: auto;
      }
      .page {
        max-width: 820px;
        margin: 0 auto;
        padding: 28px 32px 80px;
      }
      .page h2 {
        font-size: 26px;
        margin: 0 0 18px;
      }
      /* Document: session.md, rendered and editable (md-notes.js) */
      #doc {
        line-height: 1.55;
      }
      #doc.md[data-empty='true']::before {
        content: attr(data-placeholder);
      }
      #doc .ProseMirror {
        outline: none;
      }
      #doc img {
        max-width: 100%;
        border-radius: var(--ds-radius);
        box-shadow: var(--ds-e1);
      }
      #doc h1 {
        font-size: 1.6em;
      }
      #doc h2 {
        font-size: 1.05em;
        font-weight: var(--ds-font-weight-medium);
        margin: 2em 0 0.4em;
      }
      #doc ol > li::marker {
        color: #e5484d; /* the annotation palette's coral red: the note numbers match the numbers on the marks */
      }
      #doc code {
        font:
          0.92em ui-monospace,
          monospace;
        background: var(--ds-color-soft);
        padding: 0 3px;
        border-radius: 3px;
      }
      #doc pre {
        background: var(--ds-color-soft);
        padding: 8px 10px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      #doc pre code {
        background: none;
        padding: 0;
      }
      /* "Text in the screenshot": session.md's <details> tags show as a quiet label over the text, not as raw HTML */
      #doc span[data-type='html'][data-value^='<details>'] {
        font-size: 0;
      }
      #doc span[data-type='html'][data-value^='<details>']::before {
        content: 'Text in the screenshot';
        font-size: 13px;
      }
      #doc p:has(> span[data-type='html'][data-value='</details>']) {
        display: none;
      }
      #doc blockquote {
        margin-left: 0;
        padding-left: 12px;
        border-left: 3px solid var(--ds-color-edge);
      }
      /* Screenshots: a grid of thumbnails, each on the raised fill; the one under the pointer takes the soft fill */
      #grid-view {
        padding: 28px 32px 60px;
      }
      #grid-view h2 {
        font-size: 26px;
        margin: 0 0 18px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      .thumb {
        position: relative;
        border-radius: var(--ds-radius-large);
        background: var(--ds-color-soft-hover);
        overflow: hidden;
      }
      .thumb:hover,
      .thumb:focus-within {
        background: var(--ds-color-soft);
      }
      .thumb .pic {
        display: block;
        width: 100%;
        height: auto;
        padding: 0;
        border-radius: 0;
        aspect-ratio: 16 / 10;
        background: var(--ds-color-ground);
      }
      .thumb .pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
      .thumb .edit,
      .thumb .more {
        position: absolute;
        opacity: 0;
      }
      .thumb:hover .edit,
      .thumb:hover .more,
      .thumb:focus-within .edit,
      .thumb:focus-within .more {
        opacity: 1;
      }
      /* Over the picture: the popover's fill, so they read on any screenshot */
      .thumb .edit,
      .thumb .more {
        background: var(--ds-popover-fill);
        box-shadow: var(--ds-e1);
      }
      .thumb .edit {
        top: 31%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .thumb .more {
        top: 8px;
        right: 8px;
        width: var(--ds-control-md);
        padding: 0 0 4px;
        font-size: 16px;
        line-height: 1;
        font-weight: 700;
      }
      .thumb .label {
        display: grid;
        gap: 2px;
        padding: 10px 12px 12px;
      }
      .thumb .heading {
        font-size: 14px;
      }
      .thumb .notes {
        font-size: 13px;
      }
      .menu {
        position: fixed;
        padding: var(--ds-space-4);
        border-radius: var(--ds-radius-large);
        background: var(--ds-popover-fill);
        box-shadow: var(--ds-menu-shadow);
        z-index: var(--ds-z-menu);
      }
      /* A menu's row: the soft fill under the pointer or the keys, as a macOS menu highlights it */
      .menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
      }
      .menu button:hover,
      .menu button:focus-visible {
        background: var(--ds-color-soft);
        outline: none;
      }
      /* Screenshots: one at a time */
      #shots {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
      }
      #shots .stage {
        display: grid;
        place-items: center;
        padding: 16px;
        min-height: 0;
      }
      #shot,
      #gif {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: var(--ds-e2);
      }
      /* A recording: its badge and facts over its filmstrip and its GIF, side by side (screens.md, Session window) */
      #shots .stage.rec {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px 24px;
        place-items: stretch;
      }
      .stage:not(.rec) .rec-only {
        display: none;
      }
      .stage:not(.rec) .pane:not(.rec-only) {
        display: contents; /* a screenshot: its image sits in the stage as before */
      }
      .pane {
        margin: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        justify-items: center;
        gap: 8px;
      }
      .pane figcaption,
      .rec-head,
      #gif-missing {
        font-size: 13px;
        margin: 0;
      }
      .rec-head {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .badge {
        padding: 1px 7px;
        border-radius: 4px;
        background: var(--ds-color-soft);
        font-size: 12px;
        font-weight: var(--ds-font-weight-semibold);
      }
      .thumb .badge {
        justify-self: start;
      }
      #shots .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        padding: 10px;
        border-top: var(--ds-border) solid var(--ds-color-edge);
        background: var(--ds-color-panel);
      }
      #back {
        margin-right: auto;
      }
      #shots .bar .end {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      #count {
        min-width: 110px;
        text-align: center;
      }
      /* Discarded */
      .quiet {
        margin: -10px 0 24px;
        font-size: 15px;
      }
      .gone {
        display: grid;
        grid-template-columns: 300px 1fr auto;
        gap: 24px;
        align-items: start;
        padding: 18px 0;
        border-top: var(--ds-border) solid var(--ds-color-edge);
      }
      .gone img {
        width: 100%;
        max-height: 190px;
        object-fit: contain;
        object-position: top left;
        border-radius: var(--ds-radius);
        background: var(--ds-color-soft-hover);
      }
      .gone .when {
        font-size: 15px;
        margin-bottom: 6px;
      }
      .gone .what {
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="icon" src="logo.svg" alt="" />
      <div class="name" id="name">
        <button id="title" title="Rename (↩)"></button>
        <button id="pencil" title="Rename (↩)" aria-label="Rename session">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" /></svg>
        </button>
        <input id="rename" aria-label="Session name" aria-describedby="hint" placeholder="Name this session" spellcheck="false" />
        <div id="hint" role="status"></div>
      </div>
      <span id="total"></span>
      <div class="tabs">
        <button id="tab-doc" aria-pressed="true">Document</button>
        <button id="tab-shots" aria-pressed="false">Screenshots</button>
        <button id="tab-discarded" aria-pressed="false" hidden>Discarded <span id="discarded-count"></span></button>
      </div>
      <button id="external" title="Open session.md in your Markdown app">Open in Markdown App</button>
    </header>
    <main>
      <div class="page" id="doc-page"><div id="doc"></div></div>
      <section id="grid-view" hidden>
        <h2>Screenshots</h2>
        <div id="grid"></div>
        <p class="empty" id="grid-empty">No screenshots yet. Capture one with ⌃⇧4.</p>
      </section>
      <section id="shots" hidden>
        <div class="stage" id="stage">
          <p class="rec-head rec-only"><span class="badge">Recording</span><span id="rec-facts"></span></p>
          <figure class="pane">
            <figcaption class="rec-only">Filmstrip · for the AI</figcaption>
            <img id="shot" alt="" tabindex="-1" />
          </figure>
          <figure class="pane rec-only">
            <figcaption>GIF · for people</figcaption>
            <img id="gif" alt="" />
            <span>
              <button id="play" title="Play the GIF (Space)">Play</button>
              <span id="gif-missing" hidden>The GIF is missing. The filmstrip is still in the session.</span>
            </span>
          </figure>
        </div>
        <div class="bar">
          <button id="back" title="All screenshots (Esc)">‹ All Screenshots</button>
          <button id="prev" title="Previous (←)">←</button>
          <span id="count"></span>
          <button id="next" title="Next (→)">→</button>
          <span class="end">
            <button id="edit" class="primary" title="Open it in the editor with its marks (⌘O)">Edit Again</button>
            <button id="remove" title="Move it to Discarded for 7 days (⌘⌫)">Remove from Session</button>
          </span>
        </div>
      </section>
      <section class="page" id="discarded" hidden>
        <h2>Discarded</h2>
        <p class="quiet">Discarded screenshots are kept for 7 days.</p>
        <div id="discarded-list"></div>
      </section>
    </main>
    <!-- Says what ⌘⌫, Remove from Session and ⌘Z did, for VoiceOver; nothing on screen. Outside every view, so a hidden
         view never silences it. -->
    <p
      id="announce"
      role="status"
      style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0"
    ></p>
    <div class="menu" id="menu" role="menu" hidden><button id="menu-remove" role="menuitem">Remove from Session</button></div>
    <template id="thumb-t">
      <div class="thumb">
        <button class="pic"><img alt="" loading="lazy" /></button>
        <button class="edit" title="Open it in the editor with its marks">Edit Again</button>
        <button class="more" title="More" aria-label="More" aria-haspopup="menu">…</button>
        <div class="label"><span class="badge"></span><span class="heading"></span><span class="notes"></span></div>
      </div>
    </template>
    <template id="gone-t">
      <div class="gone">
        <img alt="" />
        <div>
          <div class="when"></div>
          <div class="what"></div>
        </div>
        <button>Reopen</button>
      </div>
    </template>
    <script src="md-notes.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
