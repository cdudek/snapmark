<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Keyboard Shortcuts</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <style>
      /* The calm Keyboard Shortcuts window (spec screens.md): colours and shapes from tokens.css only (F30), the
         system's colours following light and dark. Every text is in the text colour: the system's dim text misses 4.5:1
         (N1, questions.md). */
      html,
      body {
        margin: 0;
        background: var(--ds-color-ground);
        color: var(--ds-color-ink);
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
      }
      /* Two columns with a hairline between; below 760 pt they stack, Other keys first. */
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr);
        align-items: start;
        padding: 24px 32px 32px;
        gap: 0 32px;
      }
      #tools {
        border-left: var(--ds-border) solid var(--ds-color-edge);
        padding-left: 32px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        #tools {
          border-left: 0;
          padding-left: 0;
          margin-top: 24px;
        }
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 24px 0 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      tr {
        border-top: var(--ds-border) solid var(--ds-color-edge);
      }
      td {
        padding: 8px 16px 8px 0;
        vertical-align: middle;
      }
      td.keys {
        white-space: nowrap;
        width: 1%;
      }
      td.again {
        width: 1%;
        font-size: 12px;
      }
      td.name {
        font-weight: 600;
        white-space: nowrap;
        width: 1%;
      }
      .or {
        margin: 0 8px;
        font-size: 12px;
      }
      /* A key drawn as a cap, which F231 asks for: 11 px, weight 500, system glyphs, tabular digits, the text's colour. */
      kbd {
        display: inline-block;
        font:
          500 11px/14px -apple-system,
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        color: inherit;
        white-space: nowrap;
        min-width: 16px;
        text-align: center;
        padding: 4px 10px; /* the glyph never touches the border */
        border: var(--ds-border) solid var(--ds-color-edge);
        border-radius: 6px;
        box-shadow: 0 1px 0 var(--ds-color-edge);
        background: var(--ds-color-ground);
      }
      td.icon {
        width: 1%;
      }
      td.icon svg {
        display: block;
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #setting {
        margin: 16px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="other" aria-labelledby="other-title"><h1 id="other-title">Other keys</h1></section>
      <section id="tools" aria-labelledby="tools-title">
        <h1 id="tools-title">Editor tools</h1>
        <table id="tool-rows"></table>
        <p id="setting"></p>
      </section>
    </main>
    <script src="tools.js"></script>
    <script src="shortcuts.js"></script>
  </body>
</html>
