<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Countdown</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <style>
      /* The calm countdown (spec screens.md, Panels): colours from tokens.css only (F22). */
      :root {
        --countdown-square: 240px;
        --countdown-digit: 160px;
      }
      /* About 150 % (countdown.ts sets --zoom, the page zoom): a 300 pt square and a 200 pt digit on screen, where CSS
         pixels are already zoomed. */
      :root.zoomed {
        --countdown-square: calc(300px / var(--zoom));
        --countdown-digit: calc(200px / var(--zoom));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        pointer-events: none; /* the window ignores the mouse as well; clicks reach the app under it (F29) */
        font:
          var(--ds-type-control-weight) var(--ds-type-control-size) / var(--ds-type-control-line) -apple-system,
          system-ui,
          sans-serif;
      }
      /* The area, dashed, no handles: the lightest line over a dark shadow, as macOS outlines an area, never the accent
         (F18). Its ::before dims the rest of the display by 20 %: the darkest grey at that opacity, as the tokens have no
         see-through colour; under the line, over the shadow. */
      #outline {
        position: fixed;
        outline: 2px dashed var(--ds-primitive-color-neutral-0);
        box-shadow: 0 0 3px 1px var(--ds-primitive-color-neutral-950);
      }
      #outline::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        box-shadow: 0 0 0 100vmax var(--ds-primitive-color-neutral-950);
        opacity: 0.2;
      }
      #outline[hidden] {
        display: none;
      }
      /* The system's popover colours: the page cannot blur the desktop behind a see-through window (F16). */
      #square {
        position: fixed;
        box-sizing: border-box;
        width: var(--countdown-square);
        height: var(--countdown-square);
        max-width: 100vw; /* never larger than the display */
        max-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: var(--ds-radius-large);
        background: var(--ds-popover-fill);
        box-shadow: var(--ds-popover-shadow);
        color: var(--ds-color-ink);
      }
      #digit {
        font:
          800 var(--countdown-digit) / 1 -apple-system,
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      #digit.tick {
        animation: tick 300ms ease-out;
      }
      @keyframes tick {
        from {
          transform: scale(1.2);
          opacity: 0.3;
        }
      }
      /* ACC-5: the digit changes without scale or fade (F32). */
      @media (prefers-reduced-motion: reduce) {
        #digit.tick {
          animation: none;
        }
      }
      #line {
        color: var(--ds-color-dim);
      }
      #say {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <div id="outline" hidden></div>
    <div id="square" aria-hidden="true"><span id="digit"></span><span id="line">Esc cancels</span></div>
    <div id="say" role="status" aria-live="polite"></div>
    <script src="countdown.js"></script>
  </body>
</html>
