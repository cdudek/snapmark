<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Countdown</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #2492ff; /* the area outline, as the bar's chosen mode */
        --countdown-square: 240px;
        --countdown-digit: 160px;
      }
      /* About 150 % (countdown.ts sets --zoom, the page zoom): a 300 pt square and a 200 pt digit on screen, where CSS
         pixels are already zoomed. */
      :root.zoomed {
        --countdown-square: calc(300px / var(--zoom));
        --countdown-digit: calc(200px / var(--zoom));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        pointer-events: none; /* the window ignores the mouse as well; clicks reach the app under it (F29) */
        font:
          15px -apple-system,
          system-ui,
          sans-serif;
      }
      /* The area, dashed, no handles; its shadow dims the rest of the display by 20 %. */
      #outline {
        position: fixed;
        outline: 2px dashed var(--accent);
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 0.2);
      }
      #outline[hidden] {
        display: none;
      }
      /* Frosted popover material: the page cannot blur the desktop behind a transparent window, so a near-opaque fill. */
      #square {
        position: fixed;
        box-sizing: border-box;
        width: var(--countdown-square);
        height: var(--countdown-square);
        max-width: 100vw; /* never larger than the display */
        max-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: light-dark(rgb(246 246 246 / 0.9), rgb(40 40 40 / 0.9));
        box-shadow: 0 8px 32px rgb(0 0 0 / 0.3);
        color: CanvasText;
      }
      #digit {
        font:
          800 var(--countdown-digit) / 1 -apple-system,
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      #digit.tick {
        animation: tick 300ms ease-out;
      }
      @keyframes tick {
        from {
          transform: scale(1.2);
          opacity: 0.3;
        }
      }
      /* ACC-5: the digit changes without scale or fade (F32). */
      @media (prefers-reduced-motion: reduce) {
        #digit.tick {
          animation: none;
        }
      }
      #line {
        color: light-dark(rgb(0 0 0 / 0.6), rgb(255 255 255 / 0.6));
      }
      #say {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <div id="outline" hidden></div>
    <div id="square" aria-hidden="true"><span id="digit"></span><span id="line">Esc cancels</span></div>
    <div id="say" role="status" aria-live="polite"></div>
    <script src="countdown.js"></script>
  </body>
</html>
