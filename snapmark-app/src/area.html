<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Choose the area</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <style>
      /* The calm area picker (spec screens.md, Panels): colours from tokens.css only (F22). */
      html,
      body {
        margin: 0;
        height: 100%;
        cursor: crosshair;
        user-select: none;
        font:
          var(--ds-type-control-weight) var(--ds-type-control-size) / var(--ds-type-control-line) -apple-system,
          system-ui,
          sans-serif;
      }
      /* Dims the screen by 30 %: the darkest grey at that opacity, as the tokens have no see-through colour. While
         dragging the box's shadow dims instead, leaving the area clear. Never fully clear: macOS passes clicks on clear
         pixels through to the window behind. */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: var(--ds-primitive-color-neutral-950);
        opacity: 0.3;
      }
      body.dragging::before {
        opacity: 0.01;
      }
      /* The area: the lightest line over a dark shadow, as macOS outlines an area, never the accent (F18) */
      #box {
        position: fixed;
        outline: 1px solid var(--ds-primitive-color-neutral-0);
        box-shadow: 0 0 3px 1px var(--ds-primitive-color-neutral-950);
      }
      #box::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        box-shadow: 0 0 0 100vmax var(--ds-primitive-color-neutral-950);
        opacity: 0.3;
      }
      /* Record's last area, kept until a drag replaces it: a thicker line with handles, the rest dimmed as while dragging */
      #box.kept {
        outline-width: 2px;
      }
      #box .h {
        display: none;
        position: absolute;
        width: 10px;
        height: 10px;
        margin: -5px;
        border-radius: 50%;
        background: var(--ds-primitive-color-neutral-0);
        box-shadow: 0 0 3px 1px var(--ds-primitive-color-neutral-950);
      }
      #box.kept .h {
        display: block;
      }
      /* The hint and the size on the system's popover colours (F16) */
      #hint,
      #size {
        position: fixed;
        padding: var(--ds-space-8) var(--ds-space-12);
        border-radius: var(--ds-radius);
        background: var(--ds-color-overlay);
        box-shadow: var(--ds-e1);
        color: var(--ds-color-ink);
        pointer-events: none;
      }
      #hint {
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #size {
        padding: var(--ds-space-2) var(--ds-space-8);
        font: var(--ds-font-weight-semibold) var(--ds-type-caption-size) var(--ds-font-mono);
      }
      #say {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="hint">Drag over the area to capture. ⌃⇧4 captures it again. Esc cancels.</div>
    <div id="box" hidden>
      <i class="h" style="left: 0; top: 0"></i><i class="h" style="right: 0; top: 0"></i><i class="h" style="left: 0; bottom: 0"></i
      ><i class="h" style="right: 0; bottom: 0"></i>
    </div>
    <div id="size" hidden></div>
    <div id="say" aria-live="polite"></div>
    <script src="area.js"></script>
  </body>
</html>
