<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Capture Options</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="surface.js"></script>
    <style>
      /* The calm capture bar (spec screens.md): colours, sizes and shapes from tokens.css only (F15). The window's
         material and system text on macOS, the tokens' greys elsewhere; only Capture is filled with the accent. */
      html,
      body {
        margin: 0;
        user-select: none;
        font:
          var(--ds-type-control-weight) var(--ds-type-control-size) / var(--ds-type-control-line) -apple-system,
          system-ui,
          sans-serif;
      }
      /* One row, 8 of padding round 32-high controls: 48 tall (F4). The window is as tall as this content. */
      body {
        display: flex;
        align-items: center;
        gap: var(--ds-space-4);
        box-sizing: border-box;
        padding: var(--ds-space-8);
        border-radius: var(--ds-radius-large);
        overflow: hidden;
        background: var(--ds-color-panel);
        color: var(--ds-color-ink);
      }
      /* No border or outline at rest (F8); the chosen option is the soft pill, hover a fainter one (F7). */
      button {
        font: inherit;
        color: inherit;
        height: var(--ds-control-md);
        padding: 0 10px;
        border: 0;
        outline: 0;
        border-radius: var(--ds-radius);
        background: none;
        display: inline-flex;
        align-items: center;
        gap: var(--ds-space-6);
        flex: none;
        white-space: nowrap;
      }
      button:hover {
        background: var(--ds-color-soft-hover);
      }
      [role='radio'][aria-checked='true'] {
        background: var(--ds-color-soft);
      }
      /* The focus ring after Tab only, in the system's focus colour (F9, F10). */
      button:focus-visible {
        outline: var(--ds-ring-width) solid var(--ds-color-focus);
        outline-offset: var(--ds-ring-offset);
      }
      svg {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chev {
        width: 10px;
        height: 10px;
        color: var(--ds-color-dim);
      }
      #close {
        width: var(--ds-control-md);
        padding: 0;
        justify-content: center;
        color: var(--ds-color-dim);
      }
      #modes {
        display: flex;
        gap: var(--ds-space-4);
      }
      .sep {
        width: 1px;
        height: 20px;
        margin: 0 var(--ds-space-4);
        flex: none;
        background: var(--ds-color-edge);
      }
      /* The destination gives way first: a long session name ends in an ellipsis. Options and Capture keep the right. */
      #dest {
        flex: 0 1 auto;
        min-width: 0;
      }
      #dest-to {
        color: var(--ds-color-dim);
      }
      #dest-face {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #options {
        margin-left: auto;
      }
      #capture {
        margin-left: var(--ds-space-4);
        padding: 0 14px;
        background: var(--ds-button-fill-primary);
        color: var(--ds-button-text-primary);
        font-weight: var(--ds-button-weight-primary);
      }
      #capture kbd {
        font: inherit;
        font-weight: var(--ds-font-weight-regular);
        opacity: 0.75;
      }
      /* Where the bar does not fit its work area: the modes show their icons only, their names stay in the tooltips (F14). */
      body.narrow #modes .name {
        display: none;
      }
      body.narrow #modes [role='radio'] {
        width: var(--ds-control-md);
        padding: 0;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <button id="close" aria-label="Close" aria-keyshortcuts="Escape" title="Close (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <div id="modes" role="radiogroup" aria-label="Mode">
      <button
        role="radio"
        data-mode="area"
        aria-checked="false"
        tabindex="-1"
        aria-label="New Area"
        aria-keyshortcuts="1"
        title="New Area (1)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="2.5 2.5" /></svg
        ><span class="name">New Area</span>
      </button>
      <button
        role="radio"
        data-mode="window"
        aria-checked="false"
        tabindex="-1"
        aria-label="Window"
        aria-keyshortcuts="2"
        title="Window (2)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 9h18" /></svg
        ><span class="name">Window</span>
      </button>
      <button
        role="radio"
        data-mode="full"
        aria-checked="false"
        tabindex="-1"
        aria-label="Full Screen"
        aria-keyshortcuts="3"
        title="Full Screen (3)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="4" width="19" height="13" rx="1.5" />
          <path d="M9 20.5h6M12 17v3.5" /></svg
        ><span class="name">Full Screen</span>
      </button>
      <button
        role="radio"
        data-mode="last"
        aria-checked="false"
        tabindex="-1"
        aria-label="Last Area"
        aria-keyshortcuts="4"
        title="Last Area (4)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="4" width="16" height="12" rx="1.5" />
          <circle cx="18.5" cy="16.5" r="3.5" fill="currentColor" /></svg
        ><span class="name">Last Area</span>
      </button>
      <button
        role="radio"
        data-mode="scroll"
        aria-checked="false"
        tabindex="-1"
        aria-label="Scrolling"
        aria-keyshortcuts="5"
        title="Scrolling (5)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="2.5" width="16" height="12" rx="1.5" />
          <path d="M12 15v6.5M9 18.5l3 3 3-3" /></svg
        ><span class="name">Scrolling</span>
      </button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button id="dest" aria-haspopup="menu" aria-keyshortcuts="Shift+Meta+P Shift+Meta+O" title="Destination (⇧⌘P)">
      <span id="dest-to">To</span><span id="dest-face"></span
      ><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </button>
    <button id="options" aria-haspopup="menu" aria-keyshortcuts="Alt+O" title="Options (⌥O)">
      Options<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </button>
    <button id="capture" aria-label="Capture" aria-keyshortcuts="Enter Meta+Enter" title="Capture (↩)">
      <span id="capture-label">Capture</span><kbd aria-hidden="true">↩</kbd>
    </button>
    <script src="bar.js"></script>
  </body>
</html>
