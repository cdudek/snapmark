name: Release

# Merging a PR that bumps package.json's version releases it: this workflow
# sees a version with no matching tag, builds, and publishes release + tag.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Two quick merges must not race to publish the same version.
concurrency: release

jobs:
  version:
    # Cheap Ubuntu gate so the macOS job (10x minutes) only runs for a new version.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      # electron-builder's own temporary keychain fails to unlock on the macOS 26 runner
      # ("SecKeychainUnlock: The user name or passphrase you entered is not correct"),
      # so the certificate goes into a keychain made here and electron-builder finds it by name.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcp="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$id" ]; then echo "No Developer ID Application identity in the certificate" >&2; exit 1; fi
          # electron-builder wants the name without the "Developer ID Application: " prefix.
          echo "name=${id#Developer ID Application: }" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build DMG and ZIP
        env:
          # With the certificate imported, the app is signed with the Developer ID and notarized,
          # which auto-update on macOS requires. Without it the build is ad-hoc signed.
          SIGNED: ${{ steps.cert.outputs.signed }}
          CERT_NAME: ${{ steps.cert.outputs.name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGNED" = true ]; then
            CSC_NAME="$CERT_NAME" npx electron-builder --mac --publish never
          else
            # Missing secrets arrive as empty strings, which electron-builder reads as "set".
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # latest-mac.yml, the zips and the blockmaps are what electron-updater downloads.
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
