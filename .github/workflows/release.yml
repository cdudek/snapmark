name: Release

# Every merge to main that changes the app releases a patch (see the version job).
# A PR that bumps package.json to a new minor or major releases exactly that version.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Two quick merges must not race to publish the same version.
concurrency: release

jobs:
  version:
    # Cheap Ubuntu gate so the macOS job (10x minutes) only runs when something ships.
    #   package.json version has no release yet  -> release exactly that (a deliberate minor/major bump)
    #   otherwise, the merge changed the app      -> next patch on that line (0.4.0 -> 0.4.1 -> 0.4.2)
    #   otherwise (docs, change folders, CI only) -> no release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="$(node -p 'require("./package.json").version')"
          if ! gh release view "v$base" >/dev/null 2>&1; then
            version="$base"
          else
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- src assets build package.json package-lock.json)"
            else
              changed=unknown # first push or rewritten history: release to be safe
            fi
            if [ -z "$changed" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            line="${base%.*}"
            last="$(gh release list --limit 200 --json tagName --jq '.[].tagName' | sed -n "s/^v${line//./\\.}\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)"
            version="$line.$(( ${last:-0} + 1 ))"
          fi
          { echo "version=$version"; echo "tag=v$version"; echo "new=true"; } >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The patch number lives in the release tag, not in git: main cannot take a bot commit (the ruleset requires a PR).
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      # electron-builder's own temporary keychain fails to unlock on the macOS 26 runner
      # ("SecKeychainUnlock: The user name or passphrase you entered is not correct"),
      # so the certificate goes into a keychain made here and electron-builder finds it by name.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcp="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$id" ]; then echo "No Developer ID Application identity in the certificate" >&2; exit 1; fi
          # electron-builder wants the name without the "Developer ID Application: " prefix.
          echo "name=${id#Developer ID Application: }" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build DMG and ZIP
        env:
          # With the certificate imported, the app is signed with the Developer ID and notarized,
          # which auto-update on macOS requires. Without it the build is ad-hoc signed.
          SIGNED: ${{ steps.cert.outputs.signed }}
          CERT_NAME: ${{ steps.cert.outputs.name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGNED" = true ]; then
            CSC_NAME="$CERT_NAME" npx electron-builder --mac --publish never
          else
            # Missing secrets arrive as empty strings, which electron-builder reads as "set".
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # latest-mac.yml, the zips and the blockmaps are what electron-updater downloads.
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
