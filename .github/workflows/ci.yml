name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # Ubuntu, not macOS: macOS minutes cost 10x on private repos. Releases build on macOS.
    runs-on: ubuntu-latest
    steps:
      # The squash commit takes the PR title, and semantic-release reads it to choose the next version,
      # so the title must be a Conventional Commit: feat: → minor, fix: → patch, feat!: → major, docs:/chore:/ci: → none.
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run smoke
